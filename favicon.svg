<!--
  Scrawl 标记：一笔随手划出来的涂鸦（像蜡笔在纸上划的一道波浪）。

  只有描边没有填充，透出的是标签栏本身的颜色，浅色/深色标签栏下都自带对比，不用出两套图。
  渐变的两端是主题里那两支 logo 色：深色主题的 sky-400 和浅色主题的 sky-600。
  几何数据与 src/components/ScrawlMark.tsx 是同一份，这里的线宽加粗一档（16px 下才立得住），
  改一处要改两处。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <linearGradient id="j" x1="7" y1="4" x2="25" y2="28" gradientUnits="userSpaceOnUse">
    <stop stop-color="#38bdf8" />
    <stop offset="1" stop-color="#0284c7" />
  </linearGradient>
  <path
    fill="none"
    stroke="url(#j)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M5.5 20c1.6-6.4 4.6-8 6.4-4 1.2 2.6-.8 6.6 1 4.4 2.4-3 4.6-6.6 6.8-3.4 1.4 2.2-.8 6.4 1.2 4.4 2-2 3.6-4.6 5.6-3.4"
  />
</svg>
