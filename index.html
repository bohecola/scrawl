<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrawl</title>
    <meta name="description" content="Scrawl is a scratchpad for running JavaScript and TypeScript in the browser: write a snippet, hit run, read the console." />
    <script>
      /*
        改名迁移：项目原来叫 Jotter，localStorage 里的键都是 jotter:* 开头。
        在任何读取之前把它们改成 scrawl:*，老用户的语言、侧栏宽度、上次打开的文件都保得住。
        放在首帧脚本最前面是因为下面马上就要读 scrawl:lang；IndexedDB 那边的库名迁移在 src/lib/idb.ts。
      */
      (function () {
        try {
          var keys = []
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i)
            if (k && k.indexOf('jotter:') === 0) keys.push(k)
          }
          for (var j = 0; j < keys.length; j++) {
            var nk = 'scrawl:' + keys[j].slice('jotter:'.length)
            if (localStorage.getItem(nk) === null) localStorage.setItem(nk, localStorage.getItem(keys[j]))
            localStorage.removeItem(keys[j])
          }
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛错，没什么可迁移的 */
        }
      })()

      /*
        首帧之前定下主题：React 挂载前 <html> 上没有 data-theme，
        会先按系统配色画一帧再跳变（默认是深色模式，浅色系统上就闪一下白）。
        这里同步读一次 localStorage 把 data-theme 补上。
        键名与默认值需与 src/theme/index.tsx 的 STORAGE_KEY / getInitialMode 保持一致。
      */
      ;(function () {
        var theme = 'dark'
        try {
          var saved = localStorage.getItem('playground-theme')
          var mode = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'dark'
          theme =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : mode
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛错，退回默认深色 */
        }
        document.documentElement.setAttribute('data-theme', theme)

        /* 配色（蓝 / 粉 / 橙 / 绿 / 紫 / 青 / 石墨）与 theme 同帧补上，避免配色切换后刷新先闪一帧蓝。
           键名与 src/theme/index.tsx 的 ACCENT_KEY / getInitialAccent 保持一致。 */
        var accent = 'blue'
        try {
          var savedAccent = localStorage.getItem('playground-accent')
          if (['pink', 'orange', 'green', 'violet', 'teal', 'graphite'].indexOf(savedAccent) !== -1) {
            accent = savedAccent
          }
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛错，退回默认蓝 */
        }
        document.documentElement.setAttribute('data-accent', accent)
      })()

      /*
        同理，首帧之前定下语言：<html lang> 在 React 挂载前就已经被读走（辅助技术、
        拼写检查都看它），不该先按错的语言画一帧。

        语言表由 vite.config.ts 里的插件从 src/i18n/langs.ts 注入（下面那个 __SCRAWL_*__ 占位符），
        这里不再手抄一份。
        「按系统语言归位」的规则与 langs.ts 的 langFromTag 一致：中文按地区分简繁，其余按主语言码。
        <html dir> 也在这里先定（阿拉伯语 rtl），否则 RTL 会闪一帧错方向。
        标题就是产品名，写死在 <title> 里，不随语言变。
      */
      ;(function () {
        var LANG_TAGS = __SCRAWL_LANG_TAGS__
        var mode = 'system'
        try {
          var saved = localStorage.getItem('scrawl:lang')
          if (saved === 'system' || (saved && Object.prototype.hasOwnProperty.call(LANG_TAGS, saved))) mode = saved
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛错，退回跟随系统 */
        }
        function langFromTag(tag) {
          var parts = (tag || '').split('-')
          var primary = (parts[0] || '').toLowerCase()
          if (primary === 'zh') {
            var region = (parts[1] || '').toUpperCase()
            return region === 'TW' || region === 'HK' || region === 'MO' ? 'zhHant' : 'zh'
          }
          for (var k in LANG_TAGS) if (LANG_TAGS[k].split('-')[0] === primary) return k
          return 'en'
        }
        var lang = mode === 'system' ? langFromTag(navigator.language) : mode
        var attr = LANG_TAGS[lang] || 'en'
        document.documentElement.lang = attr
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
